name: Release

# Pushing a version tag (v0.1.0) builds, tests and publishes the exe with that version, attaches
# it to a GitHub Release, and points the Scoop manifest on main at it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version from the tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "The tag ${{ github.ref_name }} isn't vMAJOR.MINOR.PATCH." }
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: dotnet build -c Release -p:Version=${{ steps.version.outputs.version }}
      - run: dotnet test -c Release --no-build
      - run: dotnet publish src/GameBackdrop -c Release -o publish -p:Version=${{ steps.version.outputs.version }}
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        # A rerun after a later step failed replaces the exe on the release made the first time.
        run: |
          gh release view ${{ github.ref_name }} *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload ${{ github.ref_name }} publish/GameBackdrop.exe --clobber
          } else {
            gh release create ${{ github.ref_name }} publish/GameBackdrop.exe --title "Game Backdrop ${{ steps.version.outputs.version }}" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Point the Scoop manifest at the release
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $hash = (Get-FileHash publish/GameBackdrop.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          git fetch origin main
          git checkout -B main origin/main
          ./tools/update-scoop-manifest.ps1 -Manifest bucket/game-backdrop.json -Version $version -Hash $hash
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bucket/game-backdrop.json
          # A rerun whose manifest commit already landed has nothing to commit.
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'The manifest already points at this release.'; exit 0 }
          git commit -m "Scoop: game-backdrop $version"
          git push origin main
