name: Release

# Pushing a v<major>.<minor>.<patch> tag builds, tests and publishes the exe with that version,
# attaches it to a GitHub Release, and points the Scoop manifest on main at it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version from the tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "The tag ${{ github.ref_name }} isn't v<major>.<minor>.<patch>." }
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: dotnet build -c Release -p:Version=${{ steps.version.outputs.version }}
      - run: dotnet test -c Release --no-build
      - run: dotnet publish src/GameBackdrop -c Release -o publish -p:Version=${{ steps.version.outputs.version }}
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" publish/GameBackdrop.exe --title "Game Backdrop ${{ steps.version.outputs.version }}" --generate-notes
      - name: Point the Scoop manifest at the release
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/GameBackdrop.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          git fetch origin main
          git checkout -B main origin/main
          ./.github/scripts/update-scoop-manifest.ps1 -Manifest bucket/game-backdrop.json `
            -Version '${{ steps.version.outputs.version }}' `
            -Url 'https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/GameBackdrop.exe' `
            -Hash $hash
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Scoop: Game Backdrop ${{ steps.version.outputs.version }}"
          git push origin main
