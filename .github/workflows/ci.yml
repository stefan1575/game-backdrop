name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      # The single-file exe, built on every run so a PR catches a broken publish, and kept as an
      # artifact on main.
      - run: dotnet publish src/GameBackdrop -c Release -o publish
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: GameBackdrop
          path: publish/GameBackdrop.exe
          if-no-files-found: error
